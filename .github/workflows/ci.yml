name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revenue_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: revenue_analytics

    steps:
      - uses: actions/checkout@v4

      - name: Load schema and seed data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f schema.sql
          psql -v ON_ERROR_STOP=1 -q -f seed_data.sql

      - name: Run data quality checks
        run: psql -v ON_ERROR_STOP=1 -f data_quality_checks.sql

      - name: Run analysis queries
        run: psql -v ON_ERROR_STOP=1 -f analysis_queries.sql
